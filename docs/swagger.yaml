basePath: /api/v1
definitions:
  dto.BoardDetailResponse:
    properties:
      board:
        $ref: '#/definitions/model.Board'
      connections:
        items:
          $ref: '#/definitions/model.BoardConnection'
        type: array
      nodes:
        items:
          $ref: '#/definitions/model.BoardNode'
        type: array
    type: object
  dto.BoardsList:
    properties:
      boards:
        items:
          $ref: '#/definitions/model.Board'
        type: array
    type: object
  dto.ChangeBoardDetailRequest:
    properties:
      title:
        example: 新名字
        type: string
    required:
    - title
    type: object
  dto.CreateBoardRequest:
    properties:
      title:
        example: 示例白板
        type: string
    required:
    - title
    type: object
  dto.ErrorResponse:
    properties:
      detail:
        description: Detail 仅用于开发调试，非 Debug 模式下不会出现在响应中
        example: 内部错误详情
        type: string
      error:
        example: 请求出错
        type: string
    type: object
  dto.LoginRequest:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: "123456"
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginSuccess:
    properties:
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiYWRtaW4iOnRydWUsImlhdCI6MTUxNjIzOTAyMn0.KMUFsIDTnFmyG3nMiGM6H9FNFUROf3wh7SmqJp-QV30
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: "123456"
        minLength: 6
        type: string
      username:
        example: user
        type: string
    required:
    - email
    - password
    - username
    type: object
  model.Board:
    properties:
      createdAt:
        type: string
      id:
        type: string
      title:
        type: string
      updatedAt:
        type: string
      userId:
        type: string
    type: object
  model.BoardConnection:
    properties:
      boardId:
        type: string
      id:
        type: string
      sourceId:
        type: string
      sourcePort:
        description: top, bottom, left, right, center
        type: string
      style:
        description: 箭头样式、粗细等 JSON 字符串
        type: string
      targetId:
        type: string
      targetPort:
        type: string
    type: object
  model.BoardNode:
    properties:
      boardId:
        type: string
      data:
        description: 存储文本内容、颜色等自定义元数据
        type: string
      height:
        type: number
      id:
        type: string
      type:
        description: 如 "rect", "circle"
        type: string
      width:
        type: number
      x:
        type: number
      "y":
        type: number
    type: object
  model.User:
    properties:
      createdAt:
        type: string
      email:
        type: string
      id:
        description: 用户UUID
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API Docs for KernyrMind Backend
  title: KernyrMind Backend
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: 通过邮箱和密码登录已有账号
      parameters:
      - description: 登录信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功，返回用户JWT Token
          schema:
            $ref: '#/definitions/dto.LoginSuccess'
        "400":
          description: 请求体参数错误或不足
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 账户或密码错误
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: 账户或IP被封禁
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: 用户登录
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: 通过用户名、邮箱和密码注册新账号
      parameters:
      - description: 注册信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 注册成功，返回用户信息
          schema:
            $ref: '#/definitions/model.User'
        "400":
          description: 参数验证失败或邮箱已被注册
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 密码加密异常等服务器错误
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: 用户注册
      tags:
      - Auth
  /boards:
    get:
      consumes:
      - application/json
      description: 获取当前账户下的所有白板
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            $ref: '#/definitions/dto.BoardsList'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取白板列表
      tags:
      - Boards
    post:
      consumes:
      - application/json
      description: 输入标题创建新白板
      parameters:
      - description: 白板创建参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateBoardRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功，返回新白板信息
          schema:
            $ref: '#/definitions/model.Board'
        "400":
          description: 参数验证失败
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 数据库创建失败
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 在用户账户下创建新白板
      tags:
      - Boards
  /boards/{id}:
    delete:
      consumes:
      - application/json
      description: 根据白板ID删除白板的基础信息、所有节点及节点间的连线
      parameters:
      - description: 白板 ID
        example: '"board_abc123"'
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: 删除成功
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: 无权限访问
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: 白板不存在
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 删除失败
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 删除指定白板
      tags:
      - Boards
    get:
      consumes:
      - application/json
      description: 根据白板ID查询白板的基础信息、所有节点及节点间的连线
      parameters:
      - description: 白板 ID
        example: '"board_abc123"'
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            $ref: '#/definitions/dto.BoardDetailResponse'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: 无权限访问
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: 白板不存在
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取白板详情
      tags:
      - Boards
    put:
      consumes:
      - application/json
      description: 更新指定白板的标题
      parameters:
      - description: 白板 ID
        example: '"board_abc123"'
        in: path
        name: id
        required: true
        type: string
      - description: 白板创建参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ChangeBoardDetailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 修改成功，返回白板信息
          schema:
            $ref: '#/definitions/model.Board'
        "400":
          description: 参数不足
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: 权限不足
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: 白板不存在
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 数据库独学而失败
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 更新指定白板的信息
      tags:
      - Boards
  /ping:
    get:
      consumes:
      - application/json
      description: 用于检测服务健康状态
      produces:
      - application/json
      responses:
        "200":
          description: 成功返回 pong
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 心跳检测
      tags:
      - System
securityDefinitions:
  BearerAuth:
    description: '在输入框中填入: Bearer <Token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
